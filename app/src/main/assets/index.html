function dateKey(d=new Date()){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function dayBack(n){let d=new Date();d.setDate(d.getDate()-n);return dateKey(d)}
function todayCount(){return new Set(state.events.filter(e=>e.date===dateKey()).map(e=>e.id)).size}
function streak(){const dates=new Set(state.events.map(e=>e.date));let d=new Date();if(!dates.has(dateKey(d)))d.setDate(d.getDate()-1);let s=0;while(dates.has(dateKey(d))){s++;d.setDate(d.getDate()-1)}return s}
function randomize(arr){let a=arr.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function rateWord(rating){let w=currentCard();if(!w)return;let old=progress(w.id),p={...old},now=Date.now();p.seen=true;p.last=now;p.lastRating=rating;if(rating===0){p.wrong=(p.wrong||0)+1;p.reps=0;p.interval=10/1440;p.due=now+10*60*1000}else if(rating===1){p.correct=(p.correct||0)+1;p.reps=Math.max(1,p.reps||0);p.interval=1;p.due=now+24*60*60*1000}else{p.correct=(p.correct||0)+1;p.reps=(p.reps||0)+1;p.interval=p.reps===1?1:p.reps===2?3:Math.round(Math.max(7,(p.interval||1)*2.2));p.due=now+p.interval*86400000}state.progress[w.id]=p;state.events.push({date:dateKey(),id:w.id,rating});if(state.events.length>6000)state.events=state.events.slice(-4500);save();study.idx++;flipped=false;renderContent()}

function beginQuiz(mode){quizMode=mode||quizMode;let known=allWords().filter(w=>progress(w.id).seen),pool=known.length>=10?known:allWords();let questions=randomize(pool).slice(0,Math.min(10,pool.length));quiz={mode:quizMode,questions,idx:0,answers:[],selected:null};view='quiz';renderContent()}
function quizOptions(w){let alt=randomize(allWords().filter(x=>x.id!==w.id&&x.category===w.category)).slice(0,3);if(alt.length<3)alt=alt.concat(randomize(allWords().filter(x=>x.id!==w.id&&!alt.some(y=>y.id===x.id))).slice(0,3-alt.length));return randomize([w,...alt]).map(x=>({id:x.id,text:quiz.mode==='choice'?x.zh:x.term}))}
function renderQuiz(){if(!quiz)return `<div class="page-head"><div><div class="eyebrow">QUICK ASSESSMENT</div><h1>能力测试</h1><p>随机抽取 10 个词，检查能否脱离卡片真正认出它们。</p></div></div><div class="quiz-shell"><div class="card" style="text-align:center;padding:42px 28px"><div style="font-size:45px">🧩</div><h2 style="font-size:23px;margin:17px 0 9px">把“见过”变成“掌握”</h2><p class="help-text">选择中文释义，或挑战看中文默写英文。答错的词会进入待复习清单。</p><div class="tabs" style="justify-content:center;margin:23px 0"><button class="tab ${quizMode==='choice'?'active':''}" data-act="quiz-mode" data-mode="choice">四选一认词</button><button class="tab ${quizMode==='spell'?'active':''}" data-act="quiz-mode" data-mode="spell">拼写挑战</button></div><button class="button primary" data-act="quiz-start">开始 10 题测试 ${icon('arrow',16)}</button></div><div class="notice">小提示：优先从已学单词中出题。如果还没学过 10 个词，会从完整词库中抽取。</div></div>`;
if(quiz.idx>=quiz.questions.length){let good=quiz.answers.filter(a=>a.correct).length,all=quiz.answers.length,miss=quiz.answers.filter(a=>!a.correct);return `<div class="page-head"><div><div class="eyebrow">RESULTS</div><h1>本次测试完成</h1><p>错误词汇自动进入待复习队列。</p></div></div><div class="quiz-shell"><div class="card" style="text-align:center"><div style="font-size:44px">${good===all?'🏆':'🎯'}</div><h2 style="font-size:22px;margin:13px 0 3px">本次正确率</h2><div style="font-size:53px;font-weight:900;letter-spacing:-2px">${pct(good,all)}<span style="font-size:20px">%</span></div><p class="muted">答对 ${good} / ${all} 题</p><div class="divider"></div><div style="text-align:left">${miss.length?`<h3 style="font-size:14px">需要加强的单词</h3>${miss.map(a=>{let w=getWord(a.id);return `<div class="panel-row"><div><b>${clean(w.term)}</b><p>${clean(w.zh)}</p></div><span class="tag orange">待复习</span></div>`}).join('')}`:'<p class="strong-green">这次全部答对！可以进入下一批新词。</p>'}</div><div style="display:flex;justify-content:center;gap:9px;margin-top:22px"><button class="button secondary" data-act="quiz-retry">再测一次</button><button class="button primary" data-act="nav" data-view="review">错词复习</button></div></div></div>`}
let w=quiz.questions[quiz.idx];if(!quiz.optionsFor||quiz.optionsFor.id!==w.id){quiz.optionsFor={id:w.id,options:quizOptions(w)}}let answered=quiz.selected!==null;let selected=quiz.selected;return `<div class="page-head"><div><div class="eyebrow">ACTIVE QUIZ</div><h1>${quiz.mode==='choice'?'词义理解测试':'拼写挑战'}</h1><p>答题后显示正确答案，最后统一查看错词。</p></div></div><div class="quiz-shell"><div class="study-progress"><span>${quiz.idx+1} / ${quiz.questions.length}</span><div class="bar"><span style="width:${pct(quiz.idx+1,quiz.questions.length)}%"></span></div><span>${quiz.answers.filter(a=>a.correct).length} 正确</span></div><div class="quiz-card"><div style="text-align:center;color:#96a0b0;font-size:12px;font-weight:800">QUESTION ${quiz.idx+1} / ${quiz.questions.length}</div><h2 class="quiz-question">${clean(quiz.mode==='choice'?w.term:w.zh)}</h2><div class="quiz-hint">${quiz.mode==='choice'?'选出最准确的中文含义':'请完整拼写对应的英文术语'}</div>
${quiz.mode==='choice'?`<div class="options">${quiz.optionsFor.options.map((o,i)=>`<button class="option ${answered?(o.id===w.id?'correct':o.id===selected?'wrong':''):''}" data-act="quiz-answer" data-answer="${clean(o.id)}" ${answered?'disabled':''}><span style="color:#9eabba;margin-right:10px">${'ABCD'[i]}.</span>${clean(o.text)}</button>`).join('')}</div>`:`<form id="spell-form" autocomplete="off"><input class="spell-input" id="spell-answer" name="answer" placeholder="输入英文词汇" aria-label="输入英文单词" ${answered?'disabled':''} value="${answered?clean(quiz.spellAnswer||''):''}"/><button class="button primary wide" type="submit" style="margin-top:12px" ${answered?'disabled':''}>提交答案</button></form>`}

function normalizeTerm(s){return String(s||'').toLowerCase().trim().replace(/[–—−]/g,'-').replace(/\s+/g,' ')}
function answerQuiz(answer){if(!quiz||quiz.selected!==null)return;let w=quiz.questions[quiz.idx],correct=quiz.mode==='choice'?answer===w.id:normalizeTerm(answer)===normalizeTerm(w.term);quiz.selected=answer;quiz.spellAnswer=quiz.mode==='spell'?answer:'';quiz.answers.push({id:w.id,correct});state.quizEvents.push({date:dateKey(),id:w.id,correct});if(!correct){let p={...progress(w.id)};p.seen=true;p.wrong=(p.wrong||0)+1;p.reps=0;p.interval=0;p.due=Date.now();p.lastRating=0;state.progress[w.id]=p}save();renderContent()}
function nextQuiz(){quiz.idx++;quiz.selected=null;quiz.optionsFor=null;quiz.spellAnswer='';renderContent()}
function renderLibrary(){return `<div class="page-head"><div><div class="eyebrow">PERSONAL GLOSSARY</div><h1>我的词库</h1><p>全部 ${allWords().length} 个单词 · 搜索术语、学术搭配与中文释义。</p></div><button class="button primary small" data-act="open-add">${icon('plus',16)} 自定义添加</button></div><div class="toolbar"><label class="searchbox"><input id="library-search" type="search" placeholder="搜索英文、释义、例句……" value="${clean(librarySearch)}"></label><select id="library-category" class="select"><option>全部</option>${CATEGORIES.map(c=>`<option ${c.name===libraryCategory?'selected':''}>${c.name}</option>`).join('')}</select><select class="select" id="library-status"><option>全部</option>${['未学','已学','熟练','错词','收藏'].map(s=>`<option ${s===libraryStatus?'selected':''}>${s}</option>`).join('')}</select></div><div id="library-results"></div>`}
function refreshLibrary(){let root=document.getElementById('library-results');if(!root)return;let q=librarySearch.trim().toLowerCase(),words=catWords(libraryCategory).filter(w=>{let p=progress(w.id);if(libraryStatus==='未学'&&p.seen)return false;if(libraryStatus==='已学'&&!p.seen)return false;if(libraryStatus==='熟练'&&!isMastered(w.id))return false;if(libraryStatus==='错词'&&!(p.wrong>0))return false;if(libraryStatus==='收藏'&&!state.favorites.includes(w.id))return false;return !q || [w.term,w.zh,w.phrase,w.example].join(' ').toLowerCase().includes(q)});root.innerHTML=`<div class="inline-counter">找到 ${words.length} 个词条</div><div class="word-list">${words.slice(0,250).map(w=>{let p=progress(w.id);return `<div class="word-item"><div class="initial">${clean(w.term.slice(0,2).toUpperCase())}</div><div class="content"><b>${clean(w.term)}</b><p>${clean(w.zh)} · ${clean(w.phrase)}</p></div><span class="tag ${p.seen?'':'orange'}">${isMastered(w.id)?'熟练':p.seen?'已学':'未学'}</span><div class="actions"><button class="icon-btn ${state.favorites.includes(w.id)?'fav-on':''}" data-act="fav" data-id="${clean(w.id)}" aria-label="收藏单词">${icon('star',17)}</button><button class="button secondary small" data-act="word-detail" data-id="${clean(w.id)}">详情</button></div></div>`}).join('')}</div>${words.length>250?'<p class="small-text muted">仅显示前250条，请使用搜索进一步筛选。</p>':''}`}
function renderStats(){let a=allWords(),done=studiedCount(),master=masteredCount(),quizzes=state.quizEvents.length,quizzok=state.quizEvents.filter(e=>e.correct).length;let weekly=Array.from({length:7},(_,i)=>{let key=dayBack(6-i);return {date:key,count:new Set(state.events.filter(e=>e.date===key).map(e=>e.id)).size}});let max=Math.max(8,...weekly.map(x=>x.count));return `<div class="page-head"><div><div class="eyebrow">LEARNING ANALYTICS</div><h1>学习报告与设置</h1><p>看得见的学习进度、可靠的本地备份。</p></div></div><div class="stats-summary"><div class="stat-tile"><small>词库总量</small><b>${a.length}</b></div><div class="stat-tile"><small>累计已学</small><b>${done}</b></div><div class="stat-tile"><small>熟练掌握</small><b>${master}</b></div><div class="stat-tile"><small>测试正确率</small><b>${quizzes?pct(quizzok,quizzes)+'%':'—'}</b></div></div><div class="layout-two" style="margin-top:19px"><div><div class="card chart-frame"><h3>最近七天学习词数</h3><div class="chart-days">${weekly.map(x=>`<div class="day-col"><div class="v" style="height:${Math.max(3,pct(x.count,max))}%" title="${x.count}词"></div><span class="label">${x.date.slice(5)}</span></div>`).join('')}</div></div><div class="card" style="margin-top:19px"><h2>各方向学习进度</h2><div class="topic-progress">${CATEGORIES.slice(0,6).map(c=>{let ws=catWords(c.name),n=ws.filter(w=>progress(w.id).seen).length;return `<div class="topic-progress-row"><b>${c.name}</b><div class="bar"><span style="width:${pct(n,ws.length)}%"></span></div><span class="muted">${n}/${ws.length}</span></div>`}).join('')}</div></div></div><div><div class="card"><h2>偏好设置</h2><div class="settings-row"><div><b>每日新词目标</b><p>5–40 个新词，建议从 12 个开始。</p></div><input type="number" min="5" max="40" id="daily-goal" value="${state.goal}" aria-label="每日新词目标"></div><div class="settings-row"><div><b>数据只存在本机</b><p>不会上传到服务器。换设备或清理浏览器前请导出备份。</p></div></div><div style="display:grid;gap:9px;margin-top:15px"><button class="button outline" data-act="export">${icon('arrow',16)} 导出学习备份</button><button class="button secondary" data-act="import">导入学习备份</button><input id="import-file" type="file" accept="application/json,.json" hidden><button class="button danger" data-act="reset">清空本机学习记录</button></div></div><div class="card" style="margin-top:19px"><h2>学习建议</h2><p class="help-text">没有记住的词在10分钟后重新出现；模糊的词隔天复习；答对多次的词会逐渐拉长复习间隔。优先读懂英语例句，而不是只看中文翻译。</p><p class="small-text muted">词库由通用计算机学术研究用语人工整理，并非某个词表的逐词复制；例句为教学原创示例。</p></div></div></div>`}
function renderModal(){let root=document.getElementById('modal-root');if(!root)return;if(!modal){root.innerHTML='';return}let inside='';if(modal.type==='detail'){let w=getWord(modal.id);if(!w){modal=null;root.innerHTML='';return}inside=`<h2>${clean(w.term)}</h2><div class="tag" style="display:inline-block;margin:7px 0">${clean(w.category)}</div><p><strong>中文释义：</strong>${clean(w.zh)}</p><p><strong>常用搭配：</strong>${clean(w.phrase)}</p><div class="modal-example">${clean(w.example)}</div><p>${clean(w.note)}</p><div class="modal-actions"><button class="button secondary" data-act="speak" data-word="${clean(w.id)}">${icon('speaker',15)} 朗读</button><button class="button outline" data-act="fav" data-id="${clean(w.id)}">${state.favorites.includes(w.id)?'取消收藏':'加入收藏'}</button><button class="button primary" data-act="modal-close">关闭</button></div>`}else if(modal.type==='add'){inside=`<h2>添加自己的学术词汇</h2><p>阅读论文时遇到值得记住的词，可随时加入专属词库。</p><form id="add-word-form"><div class="field"><label>英文词汇 *</label><input name="term" maxlength="80" required placeholder="e.g. hallucination"></div><div class="field"><label>中文含义 *</label><input name="zh" maxlength="120" required placeholder="e.g. 幻觉；模型编造内容"></div><div class="field"><label>常用搭配</label><input name="phrase" maxlength="140" placeholder="e.g. mitigate hallucinations"></div><div class="field"><label>英文例句</label><textarea name="example" maxlength="350" placeholder="写一句论文场景中的例句"></textarea></div><div class="field"><label>备注</label><input name="note" maxlength="180" placeholder="理解、易混淆点等"></div><div class="modal-actions"><button type="button" class="button secondary" data-act="modal-close">取消</button><button type="submit" class="button primary">保存词汇</button></div></form>`}else if(modal.type==='reset'){inside=`<h2>清空学习记录？</h2><p>此操作会删除本机的学习进度、测试记录、收藏及自行添加的词汇。建议先导出备份。此操作不可撤销。</p><div class="modal-actions"><button class="button secondary" data-act="modal-close">取消</button><button class="button danger" data-act="reset-confirm">确认清空</button></div>`}root.innerHTML=`<div class="modal-overlay" data-act="modal-backdrop"><div class="modal" role="dialog" aria-modal="true" aria-label="操作弹窗">${inside}</div></div>`}
function speak(id){let w=getWord(id);if(!w)return;if(window.AndroidBridge&&window.AndroidBridge.speak){window.AndroidBridge.speak(w.term+'. '+w.phrase);return;}if(!('speechSynthesis' in window)){toast('当前浏览器不支持语音朗读');return}window.speechSynthesis.cancel();let utter=new SpeechSynthesisUtterance(w.term+'. '+w.phrase);utter.lang='en-US';utter.rate=.85;window.speechSynthesis.speak(utter)}
let toastTimer;function toast(message){let root=document.getElementById('toast-root');if(!root)return;root.innerHTML=`<div class="toast">${clean(message)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>root.innerHTML='',3200)}
function downloadBackup(){if(window.AndroidBridge&&window.AndroidBridge.exportBackup){window.AndroidBridge.exportBackup(JSON.stringify({app:'LexiCS',version:1,exportedAt:new Date().toISOString(),data:state},null,2));toast('请选择备份保存位置');return;}let blob=new Blob([JSON.stringify({app:'LexiCS',version:1,exportedAt:new Date().toISOString(),data:state},null,2)],{type:'application/json'});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='LexiCS-backup-'+dateKey()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);toast('备份已导出')}
async function importBackup(file){if(!file)return;try{if(file.size>5*1024*1024)throw Error('文件过大');let content=JSON.parse(await file.text());if(content.app!=='LexiCS'||!content.data||typeof content.data.progress!=='object')throw Error('非LexiCS备份');let d=content.data;state={progress:d.progress||{},favorites:Array.isArray(d.favorites)?d.favorites:[],events:Array.isArray(d.events)?d.events:[],quizEvents:Array.isArray(d.quizEvents)?d.quizEvents:[],custom:Array.isArray(d.custom)?d.custom.filter(x=>x&&typeof x.term==='string'&&typeof x.zh==='string').slice(0,500):[],goal:Math.min(40,Math.max(5,Number(d.goal)||12))};save();go('home');toast('导入成功，进度已恢复')}catch(e){toast('导入失败：'+(e.message||'备份格式错误'))}}
function onClick(event){let target=event.target.closest('[data-act]');if(!target)return;let action=target.dataset.act;if(action==='flip'){toggleFlip();return}if(action==='speak'){event.stopPropagation();speak(target.dataset.word);return}if(action==='modal-backdrop'){if(event.target===target){modal=null;renderModal()}return}if(action==='modal-close'){modal=null;renderModal();return}if(action==='nav'){go(target.dataset.view);return}if(action==='start-learn'){startStudy('learn','全部');return}if(action==='continue-learn'){startStudy('learn',learnCategory);return}if(action==='learn-category'){startStudy('learn',target.dataset.category);return}if(action==='rate'){rateWord(Number(target.dataset.rating));return}if(action==='quiz-mode'){quizMode=target.dataset.mode;renderContent();return}if(action==='quiz-start'){beginQuiz(quizMode);return}if(action==='quiz-retry'){beginQuiz(quizMode);return}if(action==='quiz-answer'){answerQuiz(target.dataset.answer);return}if(action==='quiz-next'){nextQuiz();return}if(action==='word-detail'){modal={type:'detail',id:target.dataset.id};renderModal();return}if(action==='open-add'){modal={type:'add'};renderModal();return}if(action==='fav'){let id=target.dataset.id;if(state.favorites.includes(id))state.favorites=state.favorites.filter(x=>x!==id);else state.favorites.push(id);save();if(modal)renderModal();if(view==='library')refreshLibrary();toast(state.favorites.includes(id)?'已加入收藏':'已取消收藏');return}if(action==='export'){downloadBackup();return}if(action==='import'){document.getElementById('import-file')?.click();return}if(action==='reset'){modal={type:'reset'};renderModal();return}if(action==='reset-confirm'){localStorage.removeItem(STORAGE_KEY);state=initState();modal=null;study=null;quiz=null;go('home');toast('学习记录已清空');return}}
function onChange(event){let id=event.target.id;if(id==='learn-category'){startStudy('learn',event.target.value);return}if(id==='library-category'){libraryCategory=event.target.value;refreshLibrary();return}if(id==='library-status'){libraryStatus=event.target.value;refreshLibrary();return}if(id==='daily-goal'){state.goal=Math.min(40,Math.max(5,Number(event.target.value)||12));save();renderContent();toast('每日目标已更新');return}if(id==='import-file'){importBackup(event.target.files?.[0]);return}}
function onInput(event){if(event.target.id==='library-search'){librarySearch=event.target.value;refreshLibrary()}}
function onSubmit(event){if(event.target.id==='spell-form'){event.preventDefault();answerQuiz(document.getElementById('spell-answer').value);return}if(event.target.id==='add-word-form'){event.preventDefault();let d=new FormData(event.target),term=String(d.get('term')||'').trim(),zh=String(d.get('zh')||'').trim();if(!term||!zh)return;if(allWords().some(w=>w.term.toLowerCase()===term.toLowerCase())){toast('词库中已经有这个词');return}let word={id:'custom-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),category:'个人收藏',term,zh,phrase:String(d.get('phrase')||'').trim(),example:String(d.get('example')||'').trim(),note:String(d.get('note')||'').trim()};state.custom.push(word);save();modal=null;libraryCategory='个人收藏';librarySearch='';libraryStatus='全部';go('library');toast('单词已添加') }}
document.addEventListener('click',onClick);document.addEventListener('change',onChange);document.addEventListener('input',onInput);document.addEventListener('submit',onSubmit);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){modal=null;renderModal()}else if(e.key==='Enter'&&e.target?.id==='flashcard'){e.preventDefault();toggleFlip()}});
shell();if(view==='library')refreshLibrary();
const originalRenderContent=renderContent;
renderContent=function(){originalRenderContent();if(view==='library')refreshLibrary()};

</script></body></html>
